# CD: публикация образа в GHCR и деплой новой версии на сервер.
#
# Схема: пуш в main -> сборка+пуш образа (latest + версия из version.py + sha)
# -> деплой по SSH: на сервере deploy.sh тестирует НОВУЮ версию в изолированном
# контейнере, заменяет прод (canary-наблюдение 60 сек) и автоматически откатывается
# на предыдущий тег при любом сбое.
#
# Требуемые секреты репозитория: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_PORT (опц.).
name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  APP_DIR: /opt/avito_parser

jobs:
  build-publish:
    name: Сборка и публикация образа (GHCR)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Версия и имя образа
        run: |
          VERSION=$(grep -oP '(?<=^VERSION = ")[^"]+' version.py)
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "version=$VERSION"
            echo "repo=$REPO"
            echo "sha=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"
          echo "Версия: $VERSION -> образы ghcr.io/$REPO:{latest,$VERSION,sha-${GITHUB_SHA::7}}"

      - name: Логин в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}:latest
            ghcr.io/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.repo }}:sha-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Деплой на сервер (тесты + замена + автооткат)
    needs: build-publish
    runs-on: ubuntu-latest
    # environment создаёт маркер релиза; чтобы включить ручное подтверждение
    # каждого выпуска: Settings -> Environments -> production -> Required reviewers.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Загрузка деплой-скриптов на сервер
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: deploy/deploy.sh,deploy/rollback.sh
          target: ${{ env.APP_DIR }}

      - name: Деплой версии победившего образа
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            APP_DIR=${{ env.APP_DIR }} bash ${{ env.APP_DIR }}/deploy/deploy.sh ${{ needs.build-publish.outputs.version }}
