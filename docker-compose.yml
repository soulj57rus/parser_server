# Для podman-compose рекомендуется установка из ветки main:
# https://github.com/containers/podman-compose/issues/1275

services:
  parser_avito:
    container_name: avito
    build:
      context: .
      dockerfile: Dockerfile
    # image: ghcr.io/duff89/parser_avito:latest
    restart: always
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./cookies.json:/app/cookies.json:Z
      - ./result:/app/result:Z
      - ./logs:/app/logs:Z
      - type: bind
        source: database.db
        target: /app/database.db
        bind:
          create_host_path: false
          selinux: Z
